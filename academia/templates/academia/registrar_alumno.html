<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Alumno</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e9f8ef, #fff0f5);
            font-family: Arial, sans-serif;
            color: #263b31;
        }

        h2 {
            width: 100%;
            max-width: 520px;
            margin: 0;
            padding: 24px;
            border-top: 6px solid #238b57;
            border-radius: 16px 16px 0 0;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(30, 80, 50, 0.1);
            color: #205c3b;
            font-size: 26px;
            text-align: center;
        }

        form {
            width: 100%;
            max-width: 520px;
            padding: 8px 30px 30px;
            border-radius: 0 0 16px 16px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(30, 80, 50, 0.1);
        }

        p {
            margin: 18px 0;
        }

        label {
            display: inline-block;
            margin-bottom: 8px;
            color: #28563d;
            font-size: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #d5e6db;
            border-radius: 9px;
            background: #fbfefc;
            color: #263b31;
            font-family: Arial, sans-serif;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #238b57;
            box-shadow: 0 0 0 3px rgba(35, 139, 87, 0.15);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button,
        input[type="submit"] {
            width: 100%;
            margin-top: 10px;
            padding: 13px 18px;
            border: none;
            border-radius: 9px;
            background: #238b57;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover,
        input[type="submit"]:hover {
            background: #176b40;
            transform: translateY(-2px);
        }

        a {
            display: block;
            margin-top: 14px;
            padding: 12px;
            border: 2px solid #e7a0b5;
            border-radius: 9px;
            background: #fff0f5;
            color: #8d3656;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        a:hover {
            background: #fbdce7;
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 14px;
            }

            h2 {
                padding: 18px;
                font-size: 22px;
            }

            form {
                padding: 8px 20px 22px;
            }
        }
    </style>
</head>
<body>
    <h2>{% if alumno %}Editar Alumno{% else %}Registrar Alumno{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <p>
            <label>Nombre:</label><br>
            <input type="text" name="nombre" value="{{ alumno.nombre|default:'' }}" required>
        </p>
        <p>
            <label>Edad:</label><br>
            <input type="number" name="edad" value="{{ alumno.edad|default:'' }}" required>
        </p>
        <button type="submit">Guardar</button>
        <a href="{% url 'home' %}">Cancelar</a>
    </form>
</body>
</html>
