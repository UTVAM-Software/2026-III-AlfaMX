<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario</title>
</head>
<body>
    <h2>Crear Nuevo Usuario</h2>
    <form method="post">
        {% csrf_token %}
        <p><label>Nombre de usuario:</label><br><input type="text" name="username" required></p>
        <p><label>Correo electrónico:</label><br><input type="email" name="email"></p>
        <p><label>Contraseña:</label><br><input type="password" name="password" required></p>
        <p>
            <label>Asignar Grupo/Rol:</label><br>
            <select name="grupo">
                <option value="">-- Ninguno --</option>
                {% for g in grupos %}
                <option value="{{ g.pk }}">{{ g.name }}</option>
                {% endfor %}
            </select>
        </p>
        <button type="submit">Crear Usuario</button>
        <a href="{% url 'gestion_usuarios' %}">Cancelar</a>
    </form>
</body>
</html>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 35px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e9f8ef, #fff0f5);
        font-family: Arial, sans-serif;
        color: #263b31;
    }

    h2 {
        width: 100%;
        max-width: 500px;
        margin: 0;
        padding: 24px;
        background: #ffffff;
        border-top: 6px solid #238b57;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 8px 24px rgba(30, 80, 50, 0.1);
        font-size: 26px;
        text-align: center;
    }

    form {
        width: 100%;
        max-width: 500px;
        padding: 8px 30px 30px;
        background: #ffffff;
        border-radius: 0 0 16px 16px;
        box-shadow: 0 8px 24px rgba(30, 80, 50, 0.1);
    }

    p {
        margin: 18px 0;
    }

    label {
        display: inline-block;
        margin-bottom: 8px;
        color: #28563d;
        font-size: 15px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #d5e6db;
        border-radius: 9px;
        background: #fbfefc;
        color: #263b31;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
        border-color: #238b57;
        box-shadow: 0 0 0 3px rgba(35, 139, 87, 0.15);
    }

    button {
        width: 100%;
        margin-top: 10px;
        padding: 13px 18px;
        border: none;
        border-radius: 9px;
        background: #238b57;
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
    }

    button:hover {
        background: #176b40;
        transform: translateY(-2px);
    }

    a {
        display: block;
        margin-top: 14px;
        padding: 12px;
        border: 2px solid #e7a0b5;
        border-radius: 9px;
        background: #fff0f5;
        color: #8d3656;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        transition: background 0.2s;
    }

    a:hover {
        background: #fbdce7;
    }

    @media (max-width: 480px) {
        body {
            padding: 24px 14px;
        }

        h2 {
            padding: 18px;
            font-size: 22px;
        }

        form {
            padding: 8px 20px 22px;
        }
    }
</style>
