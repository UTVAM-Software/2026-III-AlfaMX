<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Módulo</title>
</head>
<body>
    <h2>{% if modulo %}Editar Módulo{% else %}Crear Módulo{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <p>
            <label>Nombre del Módulo:</label><br>
            <input type="text" name="nombre" value="{{ modulo.nombre|default:'' }}" required>
        </p>
        <p>
            <label>Orden:</label><br>
            <input type="number" name="orden" value="{{ modulo.orden|default:0 }}" required>
        </p>
        <button type="submit">Guardar</button>
        <a href="{% url 'home' %}">Cancelar</a>
    </form>
</body>
</html>
