<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad: {{ actividad.tipo }} - Alfabetiza MX</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 600px; margin: 20px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #1a237e; }
        .canvas-container { position: relative; width: 100%; max-width: 450px; height: 260px; margin: 20px auto; border: 2px dashed #90caf9; background-color: #e3f2fd; border-radius: 12px; overflow: hidden; touch-action: none; }
        .letter-guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 130px; font-weight: bold; color: rgba(21, 101, 192, 0.15); user-select: none; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: crosshair; }
        .btn-group { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
        .btn-success { background-color: #2e7d32; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-success:hover { background-color: #1b5e20; }
        .btn-secondary { background-color: #78909c; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-secondary:hover { background-color: #546e7a; }
        .nav-links { margin-top: 25px; display: flex; justify-content: center; gap: 20px; }
        .nav-links a { color: #3f51b5; font-weight: bold; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Actividad: {{ actividad.tipo }}</h1>
        <p><strong>Instrucción:</strong> {{ actividad.instruccion_audio }}</p>

        <!-- Contenedor del Lienzo con la Letra Guía de Fondo -->
        <div class="canvas-container">
            <div class="letter-guide">{{ actividad.contenido.letra|default:"A" }}</div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="btn-group">
            <button class="btn-secondary" onclick="clearCanvas()">🔄 Borrar Trazo</button>
            <button class="btn-success" onclick="confirmStroke()">✓ Confirmar Trazo</button>
        </div>

        <div class="nav-links">
            <a href="{% url 'detalle_modulo' actividad.leccion.modulo.pk %}">← Volver al módulo</a>
            <a href="{% url 'home' %}">🏠 Volver al inicio</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        // Configurar dimensiones reales del canvas según su contenedor
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0d47a1';
        }

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        let isDrawing = false;

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Eventos de Mouse
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Eventos Táctiles (para pantallas táctiles o tabletas)
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function confirmStroke() {
            alert('¡Excelente trazo! Actividad registrada correctamente.');
            window.location.href = "{% url 'detalle_modulo' actividad.leccion.modulo.pk %}";
        }
    </script>

</body>
</html>
